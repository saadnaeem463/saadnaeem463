<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" role="img" aria-label="Urdu OCR Studio project card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d4640"/>
      <stop offset="1" stop-color="#14897a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity=".15"/>
    </linearGradient>
    <clipPath id="clip"><rect x="24" y="24" width="712" height="318" rx="14"/></clipPath>
  </defs>

  <!-- card -->
  <rect x="2" y="2" width="756" height="536" rx="22" fill="#050b0a" stroke="url(#glow)" stroke-width="2.5"/>

  <!-- preview -->
  <g clip-path="url(#clip)">
    <rect x="24" y="24" width="712" height="318" fill="#f2f8f6"/>
    <rect x="24" y="24" width="712" height="206" fill="url(#hero)"/>
    <circle cx="640" cy="70" r="92" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="30"/>
    <circle cx="640" cy="70" r="52" fill="#ffffff" fill-opacity=".05"/>

    <circle cx="56" cy="62" r="5" fill="#5eead4"/>
    <text x="70" y="67" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#99f6e4" letter-spacing="1.5">URDU OCR · CRNN + CTC</text>
    <text x="54" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Read Urdu,</text>
    <text x="54" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1.5">effortlessly.</text>
    <text x="56" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c9f1ea">Turn a photo or scan of printed Urdu into clean, readable text.</text>

    <!-- upload box -->
    <rect x="48" y="248" width="318" height="76" rx="10" fill="#ffffff" stroke="#7cc4b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="62" y="262" width="92" height="30" rx="8" fill="#ffffff" stroke="#b7d9d3"/>
    <path d="M80 280v-9m0 0l-4 4m4-4l4 4" stroke="#0f5c52" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="281" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f5c52">Upload</text>
    <text x="62" y="311" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b8a85">Drop a printed Urdu image here</text>

    <!-- result box -->
    <rect x="386" y="248" width="326" height="76" rx="10" fill="#ffffff" stroke="#cfe5e0"/>
    <text x="402" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#14897a">Extracted text</text>
    <text x="549" y="306" text-anchor="middle" font-family="Noto Nastaliq Urdu, Jameel Noori Nastaleeq, Segoe UI, Tahoma, Arial, sans-serif" font-size="22" fill="#0d2f2a" direction="rtl" unicode-bidi="bidi-override">اردو پڑھنا اب آسان</text>
  </g>

  <!-- title -->
  <text x="30" y="395" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">Urdu OCR Studio</text>
  <text x="30" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#5eead4">Deep-learning OCR that reads printed Urdu from images</text>

  <!-- tags -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#99f6e4" text-anchor="middle">
    <rect x="30" y="456" width="85" height="36" rx="18" fill="#0f2e2a" stroke="#14897a"/><text x="72.5" y="480">Python</text>
    <rect x="127" y="456" width="66" height="36" rx="18" fill="#0f2e2a" stroke="#14897a"/><text x="160" y="480">CRNN</text>
    <rect x="205" y="456" width="57" height="36" rx="18" fill="#0f2e2a" stroke="#14897a"/><text x="233.5" y="480">CTC</text>
    <rect x="274" y="456" width="113" height="36" rx="18" fill="#0f2e2a" stroke="#14897a"/><text x="330.5" y="480">Streamlit</text>
    <rect x="399" y="456" width="151" height="36" rx="18" fill="#0f2e2a" stroke="#14897a"/><text x="474.5" y="480">Deep Learning</text>
  </g>
</svg>
